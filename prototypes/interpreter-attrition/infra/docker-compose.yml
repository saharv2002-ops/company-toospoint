services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: churnscope
      POSTGRES_PASSWORD: churnscope_dev
      POSTGRES_DB: churnscope
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnscope -d churnscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://churnscope:churnscope_dev@db:5432/churnscope
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../api/app:/app/app

volumes:
  db_data:
