name: churnscope-ci

on:
  push:
    branches: [main, "prototype/interpreter-attrition"]
    paths:
      - "prototypes/interpreter-attrition/**"
      - ".github/workflows/churnscope-ci.yml"
  pull_request:
    paths:
      - "prototypes/interpreter-attrition/**"
      - ".github/workflows/churnscope-ci.yml"

jobs:
  api:
    name: api · pytest (+ postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/interpreter-attrition/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: churnscope
          POSTGRES_PASSWORD: churnscope_dev
          POSTGRES_DB: churnscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churnscope -d churnscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://churnscope:churnscope_dev@localhost:5432/churnscope
      DATABASE_URL: postgresql+psycopg://churnscope:churnscope_dev@localhost:5432/churnscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototypes/interpreter-attrition/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q

  web:
    name: web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/interpreter-attrition/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/interpreter-attrition/web/package-lock.json
      - run: npm ci
      - run: npm run build
