name: churnscope-ci

on:
  push:
    branches: [main, "prototype/interpreter-attrition"]
    paths:
      - "prototypes/interpreter-attrition/**"
      - ".github/workflows/churnscope-ci.yml"
  pull_request:
    paths:
      - "prototypes/interpreter-attrition/**"
      - ".github/workflows/churnscope-ci.yml"

jobs:
  api:
    name: api · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/interpreter-attrition/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: prototypes/interpreter-attrition/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    name: web · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/interpreter-attrition/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: prototypes/interpreter-attrition/web/package-lock.json
      - run: npm ci
      - run: npm run build
